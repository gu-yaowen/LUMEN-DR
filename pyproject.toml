[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-dr"
version = "0.1.0"
description = "Multimodal language-model representations for drug-disease association prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research code; see the repository for attribution and third-party licenses."}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.2",
    "torch-geometric>=2.7",
]

[project.optional-dependencies]
baselines = [
    "scipy>=1.10",
    "networkx>=3.0",
    "dgl>=1.1.2",
]
dev = ["pytest>=8"]

[project.scripts]
lumen-dr = "lmdda.main:main"

[tool.setuptools.packages.find]
where = ["src"]
